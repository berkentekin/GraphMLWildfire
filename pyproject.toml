[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphmlwildfire"
version = "0.1.0"
description = "Final project for Graph Machine Learning course"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "affine>=2.4.0",
    "h5py>=3.15.1",
    "numpy>=2.5.3",
    "rasterio>=1.5.2",
    "remotezip>=0.12.6",
    "requests>=2.34.2",
    "torch>=2.14.1",
    "tqdm>=4.67.1",
    "wandb>=0.30.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "bpython>=0.26",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
]
